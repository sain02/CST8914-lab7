<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Accessible Feedback Form</title>
  <style>
    .control, fieldset { margin: 6px 0; }
    label { display: inline-block; width: 120px; vertical-align: top; }
    input + label { width: auto; }
    .error, .required { color: red; }
    fieldset ul { margin: 0; }
  </style>
</head>

<body>
  <h1>Feedback Form</h1>

  <form aria-describedby="formInstructions">
    <p id="formInstructions">Fields marked with <span class="required">*</span> are required.</p>

    <!-- Added label 'for' and aria-required -->
    <div class="control">
      <label for="name">Full name <span aria-hidden="true" class="required">*</span></label>
      <input id="name" name="name" type="text" aria-required="true" />
    </div>

    <!-- Added helper text association -->
    <div class="control">
      <label for="biography">Biography</label>
      <textarea id="biography" name="biography" aria-describedby="bioHelp"></textarea>
      <span id="bioHelp">Include examples of your skills in JavaScript.</span>
    </div>

    <!-- Grouped radios with fieldset + legend -->
    <fieldset>
      <legend>Gender <span aria-hidden="true" class="required">*</span></legend>
      <div class="control">
        <input id="gender_male" name="gender" type="radio" value="male">
        <label for="gender_male">Male</label>
      </div>
      <div class="control">
        <input id="gender_female" name="gender" type="radio" value="female">
        <label for="gender_female">Female</label>
      </div>
    </fieldset>

    <!-- Linked checkbox and label -->
    <div class="control">
      <input id="accept_agbs" name="accept_agbs" type="checkbox" value="1" aria-required="true">
      <label for="accept_agbs">I accept the terms and conditions</label>
    </div>

    <div class="control">
      <input name="validate" type="hidden" value="1" />
      <input type="submit" value="Register" />
    </div>

    <!-- Added aria-live for errors -->
    <fieldset class="errors" aria-live="assertive" hidden>
      <legend>Errors</legend>
      <ul></ul>
    </fieldset>
  </form>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"
          integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
          crossorigin="anonymous"></script>

  <script>
    "use strict";
    (function () {
      $.urlParam = function (name) {
        var results = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.href);
        return results ? decodeURI(results[1]) : null;
      };

      function validateInput(input, message) {
        var $input = $('[name="' + input + '"]');
        var value = $.urlParam(input);
        if (value === null) {
          var $errorContainer = $('fieldset.errors ul');
          $('fieldset.errors').removeAttr('hidden');

          // Link error directly to field
          var $error = $('<a href="#' + $input.attr('id') + '">' + message + '</a>');
          $error.on('click', function (e) {
            e.preventDefault();
            $('#' + $input.attr('id')).focus();
          });
          $errorContainer.append('<li></li>');
          $errorContainer.find('li:last').append($error);
          $input.attr('aria-describedby', input + '_error');
        } else {
          if ($input.is(':checkbox')) $input.prop('checked', true);
          else if ($input.is(':radio')) $input.filter('[value="' + value + '"]').prop('checked', true);
          else $input.val(value);
        }
      }

      $(document).ready(function () {
        if ($.urlParam('validate')) {
          validateInput('name', 'Please enter your name!');
          validateInput('biography', 'Please tell us something about your history!');
          validateInput('gender', 'Please tell us your gender!');
          validateInput('accept_agbs', 'You must accept our terms and conditions!');
        }
      });
    })();
  </script>
</body>
</html>
